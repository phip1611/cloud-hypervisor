name: CI
on:
  pull_request: null
  push:
    branches:
      - tmp-rust-cache-bench/new-base
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  fuzz-build:
    name: fuzz-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust: [nightly]
        target: [x86_64-unknown-linux-gnu]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          components: clippy
      # Before installing cargo-fuzz so that the cache includes its binary.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Cargo fuzz
        run: cargo install cargo-fuzz
      - name: Check fuzz lockfile
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null
      - name: Fuzz Build
        run: cargo fuzz build
      - name: Fuzz Check
        run: cargo fuzz check
      - name: Clippy
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo clippy --locked --bins --manifest-path fuzz/Cargo.toml -- -D warnings
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Beta clippy is non-blocking; continue-on-error below keeps the
    # aggregated needs.quality.result green when only beta fails.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - beta
          - stable
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
        include:
          - rust: beta
            experimental: true
          - rust: stable
            experimental: false
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          override: true
          components: clippy
      # One cache for the whole job. It is restored before the bisectability
      # check so that the check also reuses the cached dependencies. The
      # Clippy steps below therefore disable their built-in rust-cache.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Bisectability Check (default features)
        if: ${{ github.event_name == 'pull_request' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          set -eufo pipefail
          commits=$(git rev-list origin/${{ github.base_ref }}..${{ github.sha }})
          for commit in $commits; do git checkout $commit; cargo check --tests --examples --all --target=${{ matrix.target }}; done
          git checkout ${{ github.sha }}
      - name: Clippy (kvm)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "kvm" -- -D warnings
      - name: Clippy (mshv)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "mshv" -- -D warnings
      - name: Clippy (mshv + kvm)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "mshv,kvm" -- -D warnings
      - name: Clippy (default features)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples -- -D warnings
      - name: Clippy (default features + dbus_api)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "dbus_api" -- -D warnings
      - name: Clippy (default features + guest_debug)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "guest_debug" -- -D warnings
      - name: Clippy (default features + pvmemcontrol)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "pvmemcontrol" -- -D warnings
      - name: Clippy (default features + tracing)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "tracing" -- -D warnings
      - name: Clippy (default features + fw_cfg)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --target=${{ matrix.target }} --locked --all --all-targets --tests --examples --features "fw_cfg" -- -D warnings
      - name: Clippy (default features + ivshmem)
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "ivshmem" -- -D warnings
      - name: Clippy (kvm + sev_snp)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "kvm,sev_snp" -- -D warnings
      - name: Clippy (mshv + sev_snp)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "mshv,sev_snp" -- -D warnings
      - name: Clippy (mshv + igvm + sev_snp)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "mshv,igvm,sev_snp" -- -D warnings
      - name: Clippy (kvm + igvm)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "kvm,igvm" -- -D warnings
      - name: Clippy (mshv + igvm)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "mshv,igvm" -- -D warnings
      - name: Clippy (kvm + igvm + sev_snp + fw_cfg)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          cross-version: 3e0957637b49b1bbced23ad909170650c5b70635
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --no-default-features --tests --examples --features "kvm,igvm,sev_snp,fw_cfg" -- -D warnings
      - name: Clippy (default features + sev_snp + igvm + fw_cfg)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: houseabsolute/actions-rust-cross@85826e468eac832e251ac58f6191ba784db237c8 # v1
        with:
          command: clippy
          use-rust-cache: false
          cross-version: 3e0957637b49b1bbced23ad909170650c5b70635
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          args: --locked --all --all-targets --tests --examples --features "sev_snp,igvm,fw_cfg" -- -D warnings
      - name: Check build did not modify any files
        run: test -z "$(git status --porcelain)"
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust:
          # Pin until https://github.com/rust-lang/rust/issues/165263 is fixed.
          - nightly-2026-10-30
          - "1.89.0" # MSRV — keep quoted.
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install musl-gcc
        run: sudo apt install -y musl-tools
      - name: Install Rust toolchain (${{ matrix.rust }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name == 'push' }}
      - name: Build (default features)
        run: cargo build --locked --bin cloud-hypervisor --target=${{ matrix.target }}
      - name: Build (kvm)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "kvm" --target=${{ matrix.target }}
      - name: Build (default features + dbus_api)
        run: cargo build --locked --bin cloud-hypervisor --features "dbus_api" --target=${{ matrix.target }}
      - name: Build (default features + guest_debug)
        run: cargo build --locked --bin cloud-hypervisor --features "guest_debug" --target=${{ matrix.target }}
      - name: Build (default features + pvmemcontrol)
        run: cargo build --locked --bin cloud-hypervisor --features "pvmemcontrol" --target=${{ matrix.target }}
      - name: Build (default features + fw_cfg)
        run: cargo build --locked --bin cloud-hypervisor --features "fw_cfg" --target=${{ matrix.target }}
      - name: Build (default features + ivshmem)
        run: cargo build --locked --bin cloud-hypervisor --features "ivshmem" --target=${{ matrix.target }}
      - name: Build (mshv)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "mshv" --target=${{ matrix.target }}
      - name: Build (mshv + igvm)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "mshv,igvm" --target=${{ matrix.target }}
      - name: Build (mshv + sev_snp)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "mshv,sev_snp" --target=${{ matrix.target }}
      - name: Build (mshv + igvm + sev_snp)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "mshv,igvm,sev_snp" --target=${{ matrix.target }}
      - name: Build (kvm + sev_snp)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "kvm,sev_snp" --target=${{ matrix.target }}
      - name: Build (kvm + igvm + sev_snp + fw_cfg)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "kvm,igvm,sev_snp,fw_cfg" --target=${{ matrix.target }}
      - name: Build (kvm + igvm)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "kvm,igvm" --target=${{ matrix.target }}
      - name: Build (mshv + kvm)
        run: cargo build --locked --bin cloud-hypervisor --no-default-features --features "mshv,kvm" --target=${{ matrix.target }}
      - name: Release Build (default features)
        run: cargo build --locked --all --release --target=${{ matrix.target }}
      - name: Check build did not modify any files
        run: test -z "$(git status --porcelain)"
